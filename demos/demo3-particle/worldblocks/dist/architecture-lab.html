<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WorldBlocks · Architecture comparisons</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./town.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>body{display:block;padding:0;background:var(--canvas);overflow:hidden}#lab-canvas{position:fixed;inset:0}#lab-controls{position:fixed;top:20px;left:24px;right:24px;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}#lab-controls button,#lab-controls label{pointer-events:auto}#lab-controls button,#lab-back{padding:10px 17px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12px;color:var(--ink)}#lab-controls button[aria-pressed=true]{background:var(--ink);color:var(--paper)}#lab-controls label{padding:10px;background:var(--paper);border-radius:20px;font-size:12px}#lab-status{position:fixed;left:24px;bottom:20px;z-index:3;font-size:13px;padding:12px 18px;background:var(--paper);border-radius:16px}#lab-back{position:fixed;top:20px;left:24px;z-index:5}body[data-walking=true] #lab-controls,body[data-walking=true] #lab-status{display:none}</style></head><body>
<div id="lab-canvas"></div><nav id="lab-controls" aria-label="Controlled architecture comparisons"></nav><button id="lab-back" hidden>Back to Diorama</button><p id="lab-status" role="status">Loading architecture comparison…</p>
<script type="module">
import {ARCHITECTURE_FIXTURES,ARCHITECTURE_METADATA,architectureState} from './src/town/architectureFixtures.js';
import {HumanTownGenerator} from './src/town/HumanTownGenerator.js';
import {Generated3DWorld} from './src/components/Generated3DWorld.js';
const controls=document.querySelector('#lab-controls'),status=document.querySelector('#lab-status'),back=document.querySelector('#lab-back');
const scene=new Generated3DWorld(document.querySelector('#lab-canvas'),label=>status.textContent=label,state=>{document.body.dataset.walking=String(state.mode!=='diorama');back.hidden=state.mode==='diorama';});
const generator=new HumanTownGenerator(),cache=new Map();let result;
for(const [id,fixture] of Object.entries(ARCHITECTURE_FIXTURES)){const button=document.createElement('button');button.textContent=fixture.title;button.dataset.fixture=id;button.onclick=()=>show(id);controls.append(button);}
const enter=document.createElement('button');enter.textContent='Explore Town';enter.onclick=()=>scene.explore.enter();controls.append(enter);back.onclick=()=>scene.explore.exit();
if(new URLSearchParams(location.search).has('debug')){
 const pause=document.createElement('label');pause.innerHTML='<input type="checkbox"> Pause life';pause.querySelector('input').onchange=e=>scene.motionPaused=e.target.checked;controls.append(pause);
 const metrics=document.createElement('output');metrics.id='life-metrics';metrics.style.cssText='position:fixed;right:24px;bottom:20px;z-index:6;padding:10px;background:var(--paper);font:11px monospace;max-width:55vw;border-radius:12px';document.body.append(metrics);
 let last=performance.now(),stamp=last,samples=[];
 function measure(now){const delta=now-last;last=now;if(!document.hidden&&delta<150)samples.push(delta);if(now-stamp>1000){const d=scene.dynamics,r=d?.registry;if(d&&samples.length){const avg=samples.reduce((a,b)=>a+b,0)/samples.length;metrics.textContent=`${Math.round(1000/avg)} fps · ${scene.renderer.info.render.calls} draws · boats ${r.ambient.boats.length} · animals ${r.living.animals.length} · smoke ${scene.world.userData.smoke?.length||0} · time ${d.time.toFixed(1)} · boat Y ${r.ambient.boats[0]?.mesh.position.y.toFixed(4)||'—'} · animal X ${r.living.animals[0]?.mesh.position.x.toFixed(4)||'—'}`;}samples=[];stamp=now;}requestAnimationFrame(measure);}requestAnimationFrame(measure);
const label=document.createElement('label');label.innerHTML='<input id="lab-influence" type="checkbox"> Influence colours';label.querySelector('input').onchange=e=>scene.setInfluenceDebug(e.target.checked);controls.append(label);}
async function show(id){controls.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='Growing '+ARCHITECTURE_FIXTURES[id].title+'…';try{if(!cache.has(id))cache.set(id,await generator.generate(architectureState(id),ARCHITECTURE_METADATA));result=cache.get(id);scene.setWorld(result);status.textContent=ARCHITECTURE_FIXTURES[id].title+' · '+result.settlementPlan.buildingPlots.length+' buildings · '+result.settlementPlan.landmarks.map(l=>l.kind.replaceAll('_',' ')).join(', ');document.querySelectorAll('[data-fixture]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.fixture===id)));}finally{controls.querySelectorAll('button').forEach(b=>b.disabled=false);enter.disabled=!scene.explore.available;}}
show('human');
</script></body></html>
